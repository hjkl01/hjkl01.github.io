name: 清理历史 GitHub Actions 运行记录

on:
  schedule:
    # 每周日 02:30 UTC 自动清理
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 14 天前的运行记录
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff="$(date -u -d '14 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          echo "清理创建时间早于 ${cutoff} 的 Actions 运行记录"

          gh run list \
            --repo "${REPOSITORY}" \
            --limit 1000 \
            --json databaseId,createdAt \
            --jq ".[] | select(.createdAt < \"${cutoff}\") | .databaseId" |
          while IFS= read -r run_id; do
            [ -n "${run_id}" ] || continue
            echo "删除运行记录: ${run_id}"
            gh run delete "${run_id}" --repo "${REPOSITORY}"
          done

          echo "历史 Actions 运行记录清理完成"
